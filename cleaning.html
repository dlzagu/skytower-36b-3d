<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#f4f0e8">
  <title>11/27 입주청소 핵심 12선 검수표 (청소를 부탁해) · 강변 36B</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f4f0e8;
      --card: #fffdf9;
      --ink: #29251f;
      --muted: #6e6559;
      --line: #ded5c7;
      --accent: #0f6b4a;
      --accent-soft: #e6f3ed;
      --warn: #b84a27;
      --warn-soft: #fdf0eb;
      --purple: #5f3dc4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 15px/1.52 system-ui, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    main { max-width: 720px; margin: 0 auto; padding: 16px 14px 72px; }
    nav { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 13px; margin-bottom: 14px; }
    nav a { color: var(--accent); font-weight: 650; text-decoration: none; }
    h1 { font-size: clamp(23px, 5vw, 32px); line-height: 1.2; letter-spacing: -.035em; margin: 0 0 6px; }
    .sub { color: var(--muted); font-size: 13.5px; margin: 0 0 14px; }

    .dashboard {
      position: sticky;
      top: 6px;
      z-index: 15;
      background: rgba(255, 253, 249, 0.96);
      backdrop-filter: blur(8px);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px;
      box-shadow: 0 4px 16px rgba(41, 37, 31, 0.06);
      margin-bottom: 16px;
    }
    .dash-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .dash-top strong { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .dash-badges { display: flex; gap: 6px; font-size: 12px; font-weight: 700; }
    .badge-ok { background: var(--accent-soft); color: var(--accent); padding: 3px 9px; border-radius: 99px; }
    .badge-fix { background: var(--warn-soft); color: var(--warn); padding: 3px 9px; border-radius: 99px; }
    .bar-track { width: 100%; height: 7px; background: #e5ddd0; border-radius: 99px; overflow: hidden; margin: 9px 0 10px; }
    .bar-fill { height: 100%; width: 0%; background: var(--accent); border-radius: 99px; transition: width .2s ease; }
    .filters { display: flex; gap: 5px; }
    .filters button {
      flex: 1;
      min-height: 35px;
      padding: 5px 8px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 12.5px;
      font-weight: 650;
      cursor: pointer;
    }
    .filters button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
    .filters button.fix-filter[aria-pressed="true"] { background: var(--warn); border-color: var(--warn); color: #fff; }

    .zone { margin: 18px 0; }
    .zone h2 { font-size: 15.5px; color: #4d453b; margin: 0 0 8px 2px; letter-spacing: -.02em; }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 11px 12px;
      margin-bottom: 7px;
    }
    .card[data-state="ok"] { background: #f5faf7; border-color: #bdd9cb; }
    .card[data-state="ok"] .item-title { color: #4a6b5a; text-decoration: line-through; }
    .card[data-state="fix"] { background: #fff6f3; border-color: #e8a48e; }
    .card-top { display: flex; justify-content: space-between; align-items: center; gap: 9px; }
    .item-body { flex: 1; min-width: 0; cursor: pointer; }
    .item-title { font-size: 14.5px; font-weight: 750; margin: 0; line-height: 1.35; }
    .item-desc { font-size: 12.5px; color: var(--muted); margin: 3px 0 0; }
    .state-btns { display: flex; gap: 4px; flex-shrink: 0; }
    .btn-state {
      min-height: 36px;
      padding: 5px 9px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #fff;
      font: inherit;
      font-size: 12px;
      font-weight: 750;
      cursor: pointer;
    }
    .btn-state.ok-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-state.fix-btn[aria-pressed="true"] { background: var(--warn); border-color: var(--warn); color: #fff; }
    .memo-input {
      display: none;
      width: 100%;
      margin-top: 8px;
      padding: 7px 9px;
      border-radius: 7px;
      border: 1px solid var(--line);
      font: inherit;
      font-size: 12.5px;
    }
    .card[data-state="fix"] .memo-input,
    .card.has-memo .memo-input { display: block; }

    details.measure-box {
      background: var(--card);
      border: 1px solid #d4caeb;
      border-radius: 12px;
      padding: 12px 14px;
      margin-top: 20px;
    }
    details.measure-box summary {
      font-size: 14px;
      font-weight: 750;
      color: var(--purple);
      cursor: pointer;
    }
    .measure-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    .measure-field label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 3px; }
    .measure-field input, .measure-field textarea {
      width: 100%; padding: 8px 9px; border: 1px solid var(--line); border-radius: 7px; font: inherit; font-size: 13px;
    }
    .measure-field.full { grid-column: 1 / -1; }

    .action-bar { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 7px; }
    .action-btn {
      flex: 1 1 160px;
      min-height: 42px;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      font: inherit;
      font-size: 13px;
      font-weight: 750;
      cursor: pointer;
    }
    .action-btn.primary { background: var(--warn); border-color: var(--warn); color: #fff; }
    .empty-msg { padding: 22px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; font-size: 13.5px; }
    .toast {
      position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
      background: #29251f; color: #fff; padding: 10px 15px; border-radius: 9px;
      font-size: 12.5px; font-weight: 650; z-index: 50;
    }
    @media (max-width: 560px) { .measure-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<main>
  <nav aria-label="이동">
    <a href="index.html#o" style="color:var(--purple)">← ★ O안 3D</a>
    <a href="o-budget.html" style="color:var(--purple)">O안 견적</a>
    <a href="measured-fit.html">실측 치수</a>
  </nav>

  <h1>🧹 입주청소 핵심 12선 검수표</h1>
  <p class="sub">업체: <b>청소를 부탁해</b> · 흰 물티슈 1장 들고 딱 이 <b>12가지만</b> 빠르게 확인하세요. (자동 저장)</p>

  <section class="dashboard" aria-label="진행률">
    <div class="dash-top">
      <strong id="progressCount">0 / 12 완료</strong>
      <div class="dash-badges">
        <span class="badge-ok" id="okBadge">✓ 0</span>
        <span class="badge-fix" id="fixBadge">⚠️ 보완 0</span>
      </div>
    </div>
    <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>
    <div class="filters">
      <button type="button" data-filter="all" aria-pressed="true">전체(12)</button>
      <button type="button" data-filter="todo" aria-pressed="false">미확인</button>
      <button type="button" data-filter="fix" class="fix-filter" aria-pressed="false">⚠️ 보완만</button>
    </div>
  </section>

  <div id="zonesContainer"></div>
  <p id="emptyMsg" class="empty-msg" hidden>해당하는 항목이 없습니다.</p>

  <details class="measure-box">
    <summary>📏 (선택) 빈집 갔을 때 재볼 실측 메모 열기</summary>
    <div class="measure-grid">
      <div class="measure-field">
        <label for="mFridgeDepth">냉장고장 깊이 (폭100×높이189 확인됨)</label>
        <input id="mFridgeDepth" type="text" placeholder="예: 72cm">
      </div>
      <div class="measure-field">
        <label for="mMwDepth">전자레인지칸 깊이 (폭53×높이33 확인됨)</label>
        <input id="mMwDepth" type="text" placeholder="예: 45cm">
      </div>
      <div class="measure-field">
        <label for="mCurtain">거실·침실 커튼박스 기본 레일 유무</label>
        <input id="mCurtain" type="text" placeholder="예: 기본 U레일 있음 / 없음">
      </div>
      <div class="measure-field">
        <label for="mDefect">기존 마루·벽지 하자 메모</label>
        <input id="mDefect" type="text" placeholder="예: 방문 앞 찍힘 촬영 완료">
      </div>
    </div>
  </details>

  <div class="action-bar">
    <button type="button" class="action-btn primary" id="copyFixBtn">⚠️ 보완 요청만 복사 (팀장님 전달용)</button>
    <button type="button" class="action-btn" id="resetBtn">초기화</button>
  </div>
</main>

<div id="toast" class="toast" hidden></div>

<script>
(function () {
  'use strict';
  var STORAGE_KEY = 'skytower36b_cleaning_core12_v2';

  var ZONES = [
    {
      id: ' kitchen',
      title: '1. 주방 · 현관 (누락 제일 많은 4곳)',
      items: [
        { id: 'c1', title: '싱크대 맨 밑 ‘걸레받이’ 안쪽 쓰레기·분진', desc: '누락 1순위! 하단 걸레받이 판 열어서 배관 밑 공사 먼지 치웠는지 확인' },
        { id: 'c2', title: '신발장 · 싱크대 서랍 끝까지 빼서 안쪽 톱밥', desc: '서랍 레일 위와 맨 아래 칸 바닥을 물티슈로 쓱 훑어보기' },
        { id: 'c3', title: '렌지후드 필터 끈적임 & 상부장 밑 블랙 레일', desc: '후드 필터 탈거 세척 상태 + 식기건조대 걸 60cm 레일 먼지 확인' },
        { id: 'c4', title: '냉장고장 · 전자레인지칸 · 세탁기칸 안쪽 분진', desc: '가전 들어오면 못 닦는 벽·바닥·콘센트 주변 톱밥 제거 확인' }
      ]
    },
    {
      id: 'living',
      title: '2. 거실 · 침실 (창틀·바닥 핵심 4곳)',
      items: [
        { id: 'c5', title: '거실·침실 사선 창틀 레일 & 유리 물얼룩', desc: '창틀 모서리에 물티슈 그었을 때 검은 흙먼지 안 묻어나오는지 + 역광 유리 얼룩' },
        { id: 'c6', title: '거실·침실 커튼박스 홈 & 천장 에어컨 겉 먼지', desc: '자동커튼 달 천장 홈 석고가루 + 에어컨 날개·환기구 주변 먼지' },
        { id: 'c7', title: '침실 붙박이장 서랍 바닥 & 방문 맨 윗면 틀', desc: '서랍 뺀 자리 톱밥 + 손 안 닿아 자주 빠지는 방문 위쪽 가로 문틀' },
        { id: 'c8', title: '전등 다 켜고 강마루 본드·페인트 자국 확인', desc: '바닥 비스듬히 보며 본드 뭉침·끈적임·걸레받이 위 먼지 체크' }
      ]
    },
    {
      id: 'bath',
      title: '3. 욕실 · 보일러실 (2곳)',
      items: [
        { id: 'c9', title: '욕실 배수구 속 트랩 & 환풍구 커버 분리 세척', desc: '배수구 뚜껑 열어 시멘트 찌꺼기 확인 + 세면대·샤워기 물 틀어 배수 확인' },
        { id: 'c10', title: '욕실 거울장 안팎·타일 물때 & 보일러실 바닥', desc: '수납장 속 먼지 + 변기 뒤편 + 보일러실 바닥 모래먼지 확인' }
      ]
    },
    {
      id: 'rule',
      title: '4. 정산 · 퇴실 전 필수 (2가지)',
      items: [
        { id: 'c11', title: '원래 있던 마루 찍힘·벽지 흠집 사진 찍어두기', desc: '11/30 관리실 하자 접수용 (청소 파손과 구분)' },
        { id: 'c12', title: '⚠️ 보완 구간 현장 재청소 확인 후 잔금 입금 + 창문 잠금', desc: '입금 전 현장에서 바로 보완받고, 나올 때 모든 이중창 잠금·일괄소등!' }
      ]
    }
  ];

  var MEASURE_IDS = ['mFridgeDepth', 'mMwDepth', 'mCurtain', 'mDefect'];

  function loadState() {
    try {
      var p = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      return { items: p.items || {}, measures: p.measures || {} };
    } catch (_) { return { items: {}, measures: {} }; }
  }

  var state = loadState();
  var currentFilter = 'all';
  var toastTimer = 0;

  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (_) {}
  }

  function showToast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.hidden = true; }, 2800);
  }

  function getRec(id) {
    var r = state.items[id];
    return r ? { status: r.status || 'todo', memo: r.memo || '' } : { status: 'todo', memo: '' };
  }

  function toggleStatus(id, target) {
    var cur = getRec(id);
    state.items[id] = { status: cur.status === target ? 'todo' : target, memo: cur.memo };
    saveState();
    render();
  }

  function updateSummary() {
    var total = 0, ok = 0, fix = 0;
    ZONES.forEach(function (z) {
      z.items.forEach(function (it) {
        total++;
        var s = getRec(it.id).status;
        if (s === 'ok') ok++;
        else if (s === 'fix') fix++;
      });
    });
    document.getElementById('progressCount').textContent = ok + ' / ' + total + ' 완료';
    document.getElementById('okBadge').textContent = '✓ ' + ok;
    document.getElementById('fixBadge').textContent = '⚠️ 보완 ' + fix;
    document.getElementById('barFill').style.width = Math.round((ok / total) * 100) + '%';
  }

  function render() {
    var root = document.getElementById('zonesContainer');
    root.innerHTML = '';
    var shown = 0;

    ZONES.forEach(function (z) {
      var list = z.items.filter(function (it) {
        var s = getRec(it.id).status;
        return currentFilter === 'all' ? true : s === currentFilter;
      });
      if (!list.length) return;
      shown += list.length;

      var sec = document.createElement('section');
      sec.className = 'zone';
      var h2 = document.createElement('h2');
      h2.textContent = z.title;
      sec.appendChild(h2);

      list.forEach(function (it) {
        var rec = getRec(it.id);
        var card = document.createElement('article');
        card.className = 'card' + (rec.memo ? ' has-memo' : '');
        card.setAttribute('data-state', rec.status);

        var top = document.createElement('div');
        top.className = 'card-top';

        var body = document.createElement('div');
        body.className = 'item-body';
        body.addEventListener('click', function () { toggleStatus(it.id, 'ok'); });

        var t = document.createElement('h3');
        t.className = 'item-title';
        t.textContent = it.title;
        var d = document.createElement('p');
        d.className = 'item-desc';
        d.textContent = it.desc;
        body.appendChild(t);
        body.appendChild(d);

        var btns = document.createElement('div');
        btns.className = 'state-btns';

        var okBtn = document.createElement('button');
        okBtn.type = 'button';
        okBtn.className = 'btn-state ok-btn';
        okBtn.setAttribute('aria-pressed', String(rec.status === 'ok'));
        okBtn.textContent = '✓';
        okBtn.addEventListener('click', function () { toggleStatus(it.id, 'ok'); });

        var fixBtn = document.createElement('button');
        fixBtn.type = 'button';
        fixBtn.className = 'btn-state fix-btn';
        fixBtn.setAttribute('aria-pressed', String(rec.status === 'fix'));
        fixBtn.textContent = '⚠️ 보완';
        fixBtn.addEventListener('click', function () { toggleStatus(it.id, 'fix'); });

        btns.appendChild(okBtn);
        btns.appendChild(fixBtn);
        top.appendChild(body);
        top.appendChild(btns);
        card.appendChild(top);

        var inp = document.createElement('input');
        inp.type = 'text';
        inp.className = 'memo-input';
        inp.placeholder = '보완할 위치 메모 (예: 싱크대 걸레받이 안쪽 톱밥)';
        inp.value = rec.memo;
        inp.addEventListener('input', function () {
          state.items[it.id] = { status: getRec(it.id).status, memo: inp.value };
          saveState();
          card.classList.toggle('has-memo', !!inp.value.trim());
        });
        card.appendChild(inp);
        sec.appendChild(card);
      });

      root.appendChild(sec);
    });

    document.getElementById('emptyMsg').hidden = shown > 0;
    updateSummary();
  }

  document.querySelectorAll('.filters button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      currentFilter = btn.getAttribute('data-filter');
      document.querySelectorAll('.filters button').forEach(function (b) {
        b.setAttribute('aria-pressed', String(b === btn));
      });
      render();
    });
  });

  MEASURE_IDS.forEach(function (id) {
    var el = document.getElementById(id);
    if (!el) return;
    el.value = state.measures[id] || '';
    el.addEventListener('input', function () {
      state.measures[id] = el.value;
      saveState();
    });
  });

  document.getElementById('copyFixBtn').addEventListener('click', function () {
    var lines = ['[입주청소 보완 요청 사항]'];
    var n = 0;
    ZONES.forEach(function (z) {
      z.items.forEach(function (it) {
        var r = getRec(it.id);
        if (r.status === 'fix') {
          n++;
          lines.push(n + '. ' + it.title + (r.memo ? ' (' + r.memo + ')' : ''));
        }
      });
    });
    if (!n) { showToast('보완 요청(⚠️)으로 표시한 항목이 없습니다.'); return; }
    var text = lines.join('\n');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { showToast('보완 요청 ' + n + '건 복사 완료!'); });
    }
  });

  document.getElementById('resetBtn').addEventListener('click', function () {
    if (!window.confirm('초기화할까요?')) return;
    state = { items: {}, measures: {} };
    MEASURE_IDS.forEach(function (id) { var el = document.getElementById(id); if (el) el.value = ''; });
    saveState();
    render();
    showToast('초기화 완료');
  });

  render();
})();
</script>
</body>
</html>
